<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="contacto" class="formulario" action="contacto" method="post">
            <fieldset>
                <legend>Formulario de Contactos</legend>
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa Nombre" required/>
                </div>
                <div class="campo">
                    <label for="paterno">Apellido Paterno</label>
                    <input type="text" id="paterno" name="paterno" placeholder="Ingresa Apellido Paterno" required />
                </div>
                <div class="campo">
                    <label for="materno">Apellido Materno</label>
                    <input type="text" id="materno" name="materno" placeholder="Ingresa Apellido Meterno" required />
                </div>
                <div class="campo">
                    <label>Correo electronico</label>
                    <input type="email" id="correo" name="correo" autocomplete="email" placeholder="Ingresa Apellido Gmail" required />
                </div>
                <div class="campo">
                    <label>Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="7" maxlength="1000" placeholder="Describe la solicitud" required></textarea>
                </div>
                <div>
                    <button type="submit">Enviar mensaje</button>
                </div>
            </fieldset>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
